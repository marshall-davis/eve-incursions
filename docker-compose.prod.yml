
services:
  init:
    image: node:22-alpine
    working_dir: /eve-incursions
    volumes:
      - ./:/eve-incursions
    command: npm i

  server:
    command: sh -c "npm run prod"
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    labels:
      caddy: eve-incursions.de
      caddy.reverse_proxy: /api* {{upstreams 4001}}
      caddy.@cachedFiles.path: "*.jpg *.jpeg *.png *.gif *.ico *.svg"
      caddy.header: '@cachedFiles Cache-Control "public, max-age=604800, must-revalidate"'

  frontend:
    command: sh -c "npm run build && npm start"
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    labels:
      caddy: eve-incursions.de
      caddy.reverse_proxy: /* {{upstreams 3000}}
      caddy.@cachedFiles.path: "*.jpg *.jpeg *.png *.gif *.ico *.svg"
      caddy.header: '@cachedFiles Cache-Control "public, max-age=604800, must-revalidate"'

  ws:
    command: sh -c "npm run prod"
    depends_on:
      init:
        condition: service_completed_successfully
    labels:
      caddy: eve-incursions.de
      caddy.reverse_proxy: /ws {{upstreams 4003}}

  postgres:
    restart: unless-stopped

  pg_backup:
    image: schickling/postgres-backup-s3
    restart: always
    networks:
      - internal
    environment:
      - POSTGRES_HOST=${PGHOST}
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DATABASE=${PGDATABASE}
      - S3_BUCKET=eve-incursions-pg-backups
      - S3_PREFIX=backups
      - S3_ENDPOINT=https://storage.googleapis.com
      - SCHEDULE=@daily
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY

networks:
  internal:
